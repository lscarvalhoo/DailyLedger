services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ledgerflow-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=LedgerFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD:-LedgerFlow_Strong_Password_2026!};Encrypt=True;TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: "${RABBITMQ_USER:-ledgerflow}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-LedgerFlow_Rabbit_2026!}"
      RabbitMq__VirtualHost: "/"
      Jwt__Key: "${JWT_KEY:-LedgerFlow-Development-Jwt-Signing-Key-2026-Change-Me}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ledgerflow-sqlserver
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LedgerFlow_Strong_Password_2026!}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1') || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: ledgerflow-adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ledgerflow-rabbitmq
    hostname: ledgerflow-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ledgerflow}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-LedgerFlow_Rabbit_2026!}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlserver-data:
  rabbitmq-data: