services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ledgerflow-sqlserver-local
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LedgerFlow_Strong_Password_2026!}"
    volumes:
      - sqlserver-local-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1') || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  adminer:
    image: adminer:latest
    container_name: ledgerflow-adminer-local
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
    depends_on:
      sqlserver:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ledgerflow-rabbitmq-local
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ledgerflow}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-LedgerFlow_Rabbit_2026!}"
    volumes:
      - rabbitmq-local-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sqlserver-local-data:
  rabbitmq-local-data: